<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Search</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2128; --dim: #6b7480; --line: #dfe3e8;
    --accent: #0b6bcb; --sel: #e6f0fb; --hit: #ffe27a; --ok: #2a9d4b; --busy: #d98e04; --bad: #d1343a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1b1f26; --ink: #e6e9ee; --dim: #8b95a3; --line: #2a303a;
            --accent: #58a6ff; --sel: #243348; --hit: #6b5a10; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: .7rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
  #q { flex: 1 1 18rem; min-width: 10rem; padding: .5rem .7rem; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: .5rem; }
  #q:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .ages { display: flex; flex-wrap: wrap; gap: .25rem; }
  .ages button { font: inherit; padding: .3rem .6rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: .45rem; cursor: pointer; }
  .ages button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #info { color: var(--dim); font-size: .85rem; min-width: 9rem; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(18rem, 5fr) 4fr; }
  #list { overflow-y: auto; border-right: 1px solid var(--line); }
  #detail { overflow-y: auto; padding: 1rem 1.2rem; }
  .row { padding: .55rem .9rem; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row[aria-selected="true"] { background: var(--sel); }
  .row .top { display: flex; gap: .5rem; align-items: baseline; }
  .dot { font-size: .8rem; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--dim); font-size: .82rem; margin-left: auto; white-space: nowrap; }
  .snip { color: var(--dim); font-size: .85rem; margin-top: .15rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  mark { background: var(--hit); color: inherit; border-radius: .15rem; padding: 0 .1rem; }
  .working { color: var(--busy); } .idle, .done { color: var(--ok); } .blocked { color: var(--bad); } .closed { color: var(--dim); }
  #detail h2 { margin: 0 0 .2rem; font-size: 1.1rem; }
  #detail .path { color: var(--dim); font-size: .82rem; word-break: break-all; margin-bottom: .8rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
  .actions button { font: inherit; padding: .45rem .8rem; border-radius: .5rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hit { margin: 0 0 .9rem; }
  .hit .when { color: var(--dim); font-size: .8rem; }
  .hit .who { font-weight: 600; font-size: .8rem; margin-left: .4rem; }
  .hit .txt { white-space: pre-wrap; word-break: break-word; }
  #toast { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .5rem .9rem; border-radius: .5rem; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: .85rem; }
  #toast.show { opacity: .95; }
  .empty { color: var(--dim); padding: 1.2rem; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 45% 55%; } #list { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1 id="h1">Chat Search</h1>
  <input id="q" type="search" autocomplete="off" spellcheck="false" autofocus>
  <div class="ages" id="ages" role="group"></div>
  <span id="info"></span>
</header>
<main>
  <div id="list" role="listbox"></div>
  <div id="detail"></div>
</main>
<div id="toast" role="status"></div>
<script>
const DE = (navigator.language || '').startsWith('de');
const T = (de, en) => DE ? de : en;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows = [], sel = 0, age = 0, seq = 0, cfg = {resumeCommand: 'claude --resume {id}', ages: [0,3,7,14,30,60,90]}, timer = null;
try { age = +localStorage.getItem('hcs-age') || 0; } catch (e) {}

document.documentElement.lang = DE ? 'de' : 'en';
$('h1').textContent = T('Chat-Suche', 'Chat Search');
$('q').placeholder = T('Stichwort tippen – mehrere Wörter = alle müssen vorkommen   ( / zum Fokussieren)', 'Type a keyword – several words = all must match   ( / to focus)');

function words() { return $('q').value.toLowerCase().split(/\s+/).filter(Boolean); }
function hl(text) {
  let h = esc(text);
  for (const w of words()) h = h.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '<mark>' + m + '</mark>');
  return h;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500); }
async function api(path, opts) { const r = await fetch(path, opts); const j = await r.json().catch(() => ({})); if (!r.ok && !j.error) j.error = r.status; return j; }

function drawAges() {
  $('ages').innerHTML = cfg.ages.map(d =>
    `<button data-age="${d}" aria-pressed="${d === age}" title="${esc(d ? T('Auch beendete Sitzungen der letzten ' + d + ' Tage durchsuchen', 'Also search closed sessions of the last ' + d + ' days') : T('Nur laufende Agenten in Herdr', 'Only agents running in Herdr'))}">${d ? d + ' ' + T('T', 'd') : T('nur offene', 'open only')}</button>`).join('');
}
$('ages').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; age = +b.dataset.age; try { localStorage.setItem('hcs-age', age); } catch (x) {} drawAges(); search(); });

function statusCls(r) { return r.live ? (r.status || 'idle') : 'closed'; }
function drawList() {
  if (!rows.length) { $('list').innerHTML = `<div class="empty">${T('Keine Treffer.', 'No matches.')}</div>`; return; }
  $('list').innerHTML = rows.map((r, i) => `
    <div class="row" data-i="${i}" role="option" aria-selected="${i === sel}" title="${esc(r.cwd || '')}">
      <div class="top"><span class="dot ${statusCls(r)}">${r.live ? '●' : '○'}</span>
        <span class="title">${esc(r.title)}</span>
        <span class="meta">${esc(r.ws)} · ${esc(r.age)}${r.n ? ' · ' + r.n + ' ' + T('Tr.', 'hits') : ''}</span></div>
      ${r.text ? `<div class="snip">${hl(r.text)}</div>` : ''}
    </div>`).join('');
}
$('list').addEventListener('click', e => { const el = e.target.closest('.row'); if (el) { select(+el.dataset.i); } });
$('list').addEventListener('dblclick', e => { if (e.target.closest('.row')) primary(); });

function select(i) {
  if (!rows.length) { $('detail').innerHTML = ''; return; }
  sel = Math.max(0, Math.min(rows.length - 1, i));
  document.querySelectorAll('.row').forEach((el, k) => el.setAttribute('aria-selected', k === sel));
  const el = document.querySelector(`.row[data-i="${sel}"]`); if (el) el.scrollIntoView({block: 'nearest'});
  drawDetail();
}

async function drawDetail() {
  const r = rows[sel]; if (!r) return;
  const mine = ++detailSeq;
  const isSid = !r.key.startsWith('pane:');
  const cmd = isSid ? cfg.resumeCommand.replace('{id}', r.key) : '';
  const acts = r.live
    ? `<button class="primary" data-a="herdr" title="${esc(T('Springt in Herdr zu diesem Agenten (herdr agent focus)', 'Jumps to this agent in Herdr (herdr agent focus)'))}">${T('Zum Agenten springen', 'Jump to agent')}</button>`
    : `<button class="primary" data-a="herdr" title="${esc(T('Neuer Herdr-Workspace im Projektordner, darin: ', 'New Herdr workspace in the project folder, running: ') + cmd)}">${T('In Herdr öffnen', 'Open in Herdr')}</button>
       <button data-a="terminal" title="${esc(T('Neues Terminalfenster, darin: ', 'New terminal window, running: ') + cmd)}">${T('Im Terminal öffnen', 'Open in terminal')}</button>`;
  $('detail').innerHTML = `<h2>${esc(r.title)}</h2>
    <div class="path">${esc(r.agent)} · ${esc(r.cwd)}${isSid ? ' · ' + esc(r.key) : ''}</div>
    <div class="actions">${acts}${isSid ? `<button data-a="copy" title="${esc(cmd)}">${T('Befehl kopieren', 'Copy command')}</button>` : ''}</div>
    <div id="hits"></div>`;
  if (!isSid) { $('hits').innerHTML = `<div class="empty">${T('Kein Chat-Protokoll bekannt (z. B. Codex-Agent). Gefunden über Titel oder Workspace-Name.', 'No chat log known (e.g. a Codex agent). Matched by title or workspace name.')}</div>`; return; }
  const p = await api('/api/preview?id=' + encodeURIComponent(r.key) + '&q=' + encodeURIComponent($('q').value));
  if (mine !== detailSeq) return;
  const who = x => x === 'user' ? T('Du', 'You') : 'AI';
  let html = '';
  if (p.kind === 'nolog') html = `<div class="empty">${T('Kein Protokoll.', 'No log.')}</div>`;
  else {
    html = `<p class="when">${p.kind === 'hits' ? p.n + ' ' + T('Treffer (die neuesten ' + p.hits.length + ')', 'hits (newest ' + p.hits.length + ')') : T('Letzte Nachrichten', 'Latest messages')}</p>`;
    html += (p.hits || []).map(h => `<div class="hit"><span class="when">${esc(h.ts)}</span><span class="who">${who(h.role)}</span><div class="txt">${hl(h.text)}</div></div>`).join('');
  }
  $('hits').innerHTML = html;
}
let detailSeq = 0;

async function act(mode) {
  const r = rows[sel]; if (!r) return;
  if (mode === 'copy') {
    const cmd = cfg.resumeCommand.replace('{id}', r.key);
    try { await navigator.clipboard.writeText(cmd); toast(T('Kopiert: ', 'Copied: ') + cmd); } catch (e) { toast(cmd); }
    return;
  }
  const j = await api('/api/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: r.key, mode})});
  toast(j.ok ? '✓ ' + (j.log || []).join('  ·  ') : '✗ ' + (j.error || '?'));
}
function primary() { const r = rows[sel]; if (r) act('herdr'); }
$('detail').addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b) act(b.dataset.a); });

async function search() {
  const mine = ++seq;
  $('info').textContent = T('suche …', 'searching …');
  const j = await api('/api/search?age=' + age + '&q=' + encodeURIComponent($('q').value));
  if (mine !== seq) return;
  if (j.error) { $('info').textContent = '✗ ' + j.error; return; }
  rows = j.rows || []; sel = 0;
  $('info').textContent = rows.length + ' · ' + j.ms + ' ms';
  drawList(); select(0);
}
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 180); });
document.addEventListener('keydown', e => {
  const inQ = document.activeElement === $('q');
  if (e.key === '/' && !inQ) { e.preventDefault(); $('q').focus(); $('q').select(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); primary(); }
  else if (e.key === 'Escape') { $('q').value = ''; $('q').focus(); search(); }
  else if (/^F[1-7]$/.test(e.key)) { e.preventDefault(); age = cfg.ages[+e.key[1] - 1]; drawAges(); search(); }
});
// Refresh the open-agent list while idle, so status dots stay current.
setInterval(() => { if (!document.hidden && !$('q').value) search(); }, 20000);

(async () => { const c = await api('/api/config'); if (c.ages) cfg = c; drawAges(); search(); })();
</script>
</body>
</html>
